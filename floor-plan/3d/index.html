<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>New Flat 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-window 3D model, one floating control card top-left, room tags pinned in the scene. Same palette as the 2D plan. */
:root{
  --paper:#e9edeb; --sheet:#fafbfa; --ink:#1c2420; --muted:#5d6a64; --rule:#d3dad6;
  --accent:#2747c9;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0f1412; --sheet:#151b18; --ink:#e3e9e5; --muted:#93a19a; --rule:#2a332f; --accent:#8ea4ff; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 var(--display);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none}
.daynight{position:fixed;top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:2;
  font:600 13px var(--display);padding:8px 14px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);
  box-shadow:0 6px 24px rgba(0,0,0,.12);cursor:pointer}
.daynight span{font-size:15px;margin-right:4px}
/* floating rotate button: shown under Day/Night only while a piece is selected, so phones don't need the control card */
.daynight.rot{top:calc(max(16px,env(safe-area-inset-top,0px)) + 50px);background:var(--accent);border-color:var(--accent);color:#fff}
.card{position:fixed;top:max(16px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  width:min(300px,calc(100vw - 32px));background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;
  display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.eyebrow{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:22px;line-height:1.1;margin:2px 0 0;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:6px}
.lbl{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
button{font:500 12.5px var(--display);border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.head button{flex:none}
.body{display:flex;flex-direction:column;gap:10px}
.card.min{width:auto;padding:8px 8px 8px 12px}
.card.min .head{align-items:center}
.card.min .eyebrow{display:none}
.card.min h1{font-size:15px;margin:0}
.sel{font:500 12px var(--mono);color:var(--accent);min-height:1.4em}
.hint{font-size:12px;color:var(--muted);margin:0}
a{color:var(--accent)}
details summary{cursor:pointer;font-size:12.5px;color:var(--muted)}
.tag{font:600 12px var(--display);color:#1c2420;background:rgba(255,255,255,.86);border-radius:4px;padding:2px 6px;white-space:nowrap;pointer-events:none}
.tag small{display:block;font:500 10px var(--mono);color:#5d6a64;text-align:center}
@media (max-width:520px){.card{padding:12px}}
</style>

<body>
<div id="stage"></div>

<button id="rotfloat" class="daynight rot" hidden title="Rotate the selected piece 90 degrees"><span aria-hidden="true">&#8635;</span> Rotate</button>
<button id="daynight" class="daynight" aria-pressed="false" title="Switch between day and night"><span aria-hidden="true">&#9790;</span> Night</button>
<div class="card" id="card">
  <div class="head">
    <div>
      <div class="eyebrow">New flat &middot; 3D model</div>
      <h1>New Flat 3D</h1>
    </div>
    <button id="toggle" aria-expanded="true" aria-controls="card-body">Hide</button>
  </div>
  <div class="body" id="card-body">
  <div>
    <div class="lbl">View</div>
    <div class="row" id="views">
      <button data-v="overview" aria-pressed="true">Overview</button>
      <button data-v="top">Top</button>
      <button data-v="bed1">Bedroom 1</button>
      <button data-v="living">Living room</button>
    </div>
  </div>
  <div>
    <div class="lbl">Walls</div>
    <div class="row" id="walls">
      <button data-h="300">Full height</button>
      <button data-h="110" aria-pressed="true">Cut away</button>
    </div>
  </div>
  <div>
    <div class="lbl">Lighting</div>
    <div class="row" id="lightmode">
      <button data-k="all">All rooms on</button>
      <button data-k="none">All rooms off</button>
    </div>
    <div class="row" id="roomlights" style="margin-top:6px" aria-label="Room light switches"></div>
  </div>
  <div class="sel" id="sel">Click a piece of furniture to select it</div>
  <div class="row"><button id="rot">Rotate selected</button><button id="reset">Reset layout</button></div>
  <p class="hint long">Drag to orbit, scroll or pinch to zoom, right-drag to pan. Click a piece to select it, then drag it to move; R rotates. Click empty space to deselect. Layout is shared with the <a href="../">2D plan</a> in this browser.</p>
  </div>
</div>

<script>
// collapsible control card: starts collapsed on phones, remembers the choice
(() => {
  const card = document.getElementById('card'), body = document.getElementById('card-body'), btn = document.getElementById('toggle');
  let pref = null; try { pref = localStorage.getItem('flat3d-card'); } catch (e) {}
  const set = open => {
    body.hidden = !open; card.classList.toggle('min', !open);
    btn.textContent = open ? 'Hide' : 'Show controls'; btn.setAttribute('aria-expanded', open);
  };
  set(pref ? pref === 'open' : innerWidth > 520);
  btn.onclick = () => { const open = body.hidden; set(open); try { localStorage.setItem('flat3d-card', open ? 'open' : 'closed'); } catch (e) {} };
})();
</script>

stage.appendChild(labelR.domElement);

// sky: gradient dome (unlit) plus stars at night; grass ground fades into the horizon with fog
const SKY = { day:{ top:0x4f95dd, hor:0xd3e8f4, fog:0xd3e8f4 }, night:{ top:0x060b1c, hor:0x1c2a4a, fog:0x1c2a4a } };

const ROOM_RECTS = [
  [0, 73.5, 332.6, 371.1, 0],                                  // Bedroom 1
  [0, -12, 332.6, 61, 1],                                      // Balcony (to the railing)

#define RM_N ${ROOM_RECTS.length}

uniform float roomIds[RM_N];
bool rmSameRoom(vec2 lp, vec2 fp) {

    const lid = new THREE.Group(); lid.position.set(0, T + 4.1, -20); lid.rotation.x = -0.18; g.add(lid);

    L(-2, 17.2, 11, 1.8, 3.3, .5, FM.maroon); L(-16.2, 8, 1.8, 1.6, 3.3, .5, FM.maroon); L(12.5, 12, 3.6, 1.6, 3.3, .5, FM.maroon);
    for (const [kx, kz] of [[15.2, 15.5], [13.4, 17.3], [15.2, 17.3], [17, 17.3]]) L(kx, kz, 1.6, 1.6, 3.3, .5, FM.maroon);

    const mouse = new THREE.Mesh(new THREE.SphereGeometry(4, 20, 14), FM.plastic); mouse.scale.set(.9, 1.1, 1.6); mouse.position.set(27, T + 3.5, 15); mouse.castShadow = true; g.add(mouse);
    const mug = new THREE.Mesh(new THREE.CylinderGeometry(4.3, 4, 10, 24), FM.mug); mug.position.set(37, T + 5.3, 0); mug.castShadow = true; g.add(mug);
    const handle = new THREE.Mesh(new THREE.TorusGeometry(2.6, .7, 8, 16), FM.mug); handle.position.set(37, T + 5.5, 4.8); handle.rotation.y = Math.PI/2; g.add(handle);
    // remotes and comb in front of the laptop
    L(-10, 3, 16, 4, 0, 1.6, FM.plastic); L(16, 2, 9, 3.5, 0, 1.4, FM.plastic); L(0, 5.6, 18, 2, 0, .5, FM.comb);

    L(39, -25, 11, 5, 0, 1.6, FM.black); L(39, -25, 10, .8, 1.6, 17, FM.acrylic);

  } else if (c.kind === 'chair') {

    for (let i = 0; i < 5; i++) { const a = i * Math.PI * 2 / 5, leg = new THREE.Mesh(new THREE.BoxGeometry(W*0.42, 3, 4), FM.black);
      leg.position.set(Math.cos(a)*W*0.2, 4, Math.sin(a)*W*0.2); leg.rotation.y = -a; leg.castShadow = true; g.add(leg); }
    const sw = exec ? W - 14 : W - 4;

    if (exec) for (const ax of [X, X+W-7]) { add(ax, Z+14, 7, D-24, seatY+16, seatY+20, FM.black); add(ax+2, Z+D-16, 3, 3, seatY, seatY+16, FM.metal); }

}
const ANG = { N:0, E:90, S:180, W:270 };
const footprint = id => { const c = catalog.find(c => c.id === id), L = layout[id], side = L.rot === 'E' || L.rot === 'W'; return { w: side ? c.d : c.w, h: side ? c.w : c.d }; };
const furnG = new THREE.Group(); scene.add(furnG);
const objs = {};
for (const c of catalog) { const g = piece(c); g.userData.id = c.id; objs[c.id] = g; furnG.add(g); }
function place(id) {
  const L = layout[id], f = footprint(id), g = objs[id];
  g.position.set(L.x + f.w/2, 0, L.y + f.h/2); g.rotation.y = -ANG[L.rot] * Math.PI / 180; dirty();
  if (lightsReady) { g.updateMatrixWorld(true); applyLights(); }
}
let lightsReady = false;
catalog.forEach(c => place(c.id));

let selected = null;
const selEl = document.getElementById('sel');
function select(id) {
  selected = id;
  for (const c of catalog) objs[c.id].traverse(o => { if (o.isMesh) o.material.emissive.setHex(c.id === id ? 0x1d3bb0 : (o.userData.glow ?? 0)); o.isMesh && (o.material.emissiveIntensity = .35); });
  if (lightsReady) applyLights();
  document.getElementById('rotfloat').hidden = !id;
  selEl.textContent = id ? 'Selected: ' + catalog.find(c => c.id === id).name + '. Drag it to move.' : 'Click a piece of furniture to select it';
}
function rotateSel() {
  if (!selected) return; const L = layout[selected], f = footprint(selected), cx = L.x + f.w/2, cy = L.y + f.h/2;
  L.rot = { W:'N', N:'E', E:'S', S:'W' }[L.rot];
  const f2 = footprint(selected), c = nearestFit({ x:Math.round(cx - f2.w/2), y:Math.round(cy - f2.h/2), w:f2.w, h:f2.h });
  if (c) { L.x = c.x; L.y = c.y; } else L.rot = { N:'W', E:'N', S:'E', W:'S' }[L.rot];   // no room to turn here: undo
  place(selected); save();
}

// drag on the floor plane
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), floorPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0), hit = new THREE.Vector3();
let drag = null;
function setPtr(ev) { const r = renderer.domElement.getBoundingClientRect(); ptr.set((ev.clientX - r.left)/r.width*2 - 1, -(ev.clientY - r.top)/r.height*2 + 1); ray.setFromCamera(ptr, camera); }
// A piece only moves once it is selected: click it first (a click, not a drag), then drag it.
// Pressing on an unselected piece orbits/pans as usual, so camera moves never shove furniture around.
const pickAt = ev => { setPtr(ev); const h = ray.intersectObjects(furnG.children, true)[0]; if (!h) return null;
  let o = h.object; while (!o.userData.id) o = o.parent; return o.userData.id; };
let press = null;
renderer.domElement.addEventListener('pointerdown', ev => {
  if (ev.button !== 0) return;
  const id = pickAt(ev);
  if (id && id === selected) {
    ray.ray.intersectPlane(floorPlane, hit);
    const L = layout[selected]; drag = { dx: hit.x - L.x, dz: hit.z - L.y };
    controls.enabled = false; renderer.domElement.setPointerCapture(ev.pointerId);
    renderer.domElement.style.cursor = 'grabbing';
  } else press = { id, x: ev.clientX, y: ev.clientY };
});
renderer.domElement.addEventListener('pointermove', ev => {
  if (press && Math.hypot(ev.clientX - press.x, ev.clientY - press.y) > 5) press = null;   // it became an orbit/pan
  if (!drag) { if (!ev.buttons) renderer.domElement.style.cursor = selected && pickAt(ev) === selected ? 'grab' : ''; return; }
  setPtr(ev); if (!ray.ray.intersectPlane(floorPlane, hit)) return;
  const L = layout[selected], f = footprint(selected);
  moveTo(L, { x:Math.round(hit.x - drag.dx), y:Math.round(hit.z - drag.dz), w:f.w, h:f.h }); place(selected);
});
const endDrag = () => {
  if (press) { select(press.id); press = null; }        // a plain click selects (or, on empty space, deselects)
  if (!drag) return; drag = null; controls.enabled = true; renderer.domElement.style.cursor = 'grab'; save();
};
renderer.domElement.addEventListener('pointerup', endDrag); renderer.domElement.addEventListener('pointercancel', () => { press = null; endDrag(); });
addEventListener('keydown', ev => { if ((ev.key === 'r' || ev.key === 'R') && !ev.metaKey && !ev.ctrlKey) rotateSel(); });
document.getElementById('rot').onclick = rotateSel;
document.getElementById('rotfloat').onclick = rotateSel;
document.getElementById('reset').onclick = () => { layout = JSON.parse(JSON.stringify(layoutDefault)); catalog.forEach(c => place(c.id)); save(); };
addEventListener('storage', e => { if (e.key !== KEY) return; try { const s = JSON.parse(e.newValue); for (const k in layout) if (s[k]) layout[k] = s[k]; catalog.forEach(c => place(c.id)); } catch (er) {} });

// ---------- light switches: one per room (fittings plus any desk / floor lamp standing in it) and global light (sun + sky) ----------
const ROOMS = [...new Set(LIGHTS.map(L => L.room))];
const lightState = { global:false, rooms:Object.fromEntries(ROOMS.map(r => [r, true])) };
try { const v = JSON.parse(localStorage.getItem('flat3d-lights')); if (v) { lightState.global = !!v.global; Object.assign(lightState.rooms, v.rooms || {}); } } catch (e) {}
// which room a point (cm) is in, using the same names as LIGHTS
function roomAt(x, z) {
  if (x >= bath2.x && x <= bath2.x + bath2.w && z >= bath2.y && z <= bath2.y + bath2.h) return 'Bath 2';
  const r = rooms.find(r => x >= r.x && x <= r.x + r.w && z >= r.y && z <= r.y + r.h);
  return !r ? null : r.name.startsWith('Living') ? 'Living' : r.name;
}
const roomBtns = {};
for (const r of ROOMS) {
  const b = document.createElement('button'); b.textContent = r; b.title = 'Switch ' + r + ' lights';
  b.onclick = () => { lightState.rooms[r] = !lightState.rooms[r]; applyLights(); };
  document.getElementById('roomlights').appendChild(b); roomBtns[r] = b;
}
const v3 = new THREE.Vector3(), dn = document.getElementById('daynight');   // day = sun + sky light on
function applyLights() {
  const { global, rooms: on } = lightState;
  // night keeps a faint cool moonlight so the outside of the flat doesn't vanish into the dark grass
  hemi.intensity = global ? HEMI_DAY : .22; sun.intensity = global ? SUN_DAY : 0;
  hemi.color.setHex(global ? 0xffffff : 0x8ea6dc); hemi.groundColor.setHex(global ? HEMI_GROUND : 0x141a26);
  const sk = global ? SKY.day : SKY.night;
  ground.material = global ? groundLit : groundDark; skyU.top.value.setHex(sk.top); skyU.hor.value.setHex(sk.hor); scene.fog.color.setHex(sk.fog); stars.visible = !global;
  dn.innerHTML = global ? '<span aria-hidden="true">&#9728;</span> Day' : '<span aria-hidden="true">&#9790;</span> Night'; dn.setAttribute('aria-pressed', !global);
  roomLights.forEach((l, i) => { l.intensity = on[LIGHTS[i].room] ? l.userData.on : 0; });
  for (const r in lampMat) lampMat[r].emissiveIntensity = on[r] ? 1.6 : .12;
  for (const l of deskLights) {
    l.getWorldPosition(v3); const lit = !!on[roomAt(v3.x, v3.z)];
    l.intensity = lit ? l.userData.on : 0;
    if (l.userData.glowMesh) l.userData.glowMesh.material.emissiveIntensity = lit ? l.userData.glowOn : .05;
  }
  for (const r of ROOMS) roomBtns[r].setAttribute('aria-pressed', !!on[r]);
  try { localStorage.setItem('flat3d-lights', JSON.stringify(lightState)); } catch (e) {}

}
dn.onclick = () => { lightState.global = !lightState.global; applyLights(); };
document.querySelector('#lightmode [data-k=all]').onclick = () => { for (const r of ROOMS) lightState.rooms[r] = true; applyLights(); };

lightsReady = true; furnG.updateMatrixWorld(true); applyLights();

// ---------- views ----------
const views = {
  overview: { pos:[CX - 300, 1650, CZ + 700], target:[CX, 0, CZ - 30] },
  top:      { pos:[CX, 1700, CZ + 1], target:[CX, 0, CZ] },
  bed1:     { pos:[322, 285, 365], target:[95, 15, 165] },
  living:   { pos:[400, 160, 750], target:[560, 90, 300] },
};
let anim = null;
function goView(name, instant) {
  const v = views[name];
  for (const b of document.querySelectorAll('#views button')) b.setAttribute('aria-pressed', b.dataset.v === name);
  const from = { p:camera.position.clone(), t:controls.target.clone() }, to = { p:new THREE.Vector3(...v.pos), t:new THREE.Vector3(...v.target) };
  // portrait screens: back the camera off so the whole flat fits across the narrow width
  if (name === 'overview' || name === 'top') { const k = Math.min(2.6, Math.max(1, 1.25 / (innerWidth / innerHeight))); to.p.sub(to.t).multiplyScalar(k).add(to.t); }
  if (instant || matchMedia('(prefers-reduced-motion: reduce)').matches) { camera.position.copy(to.p); controls.target.copy(to.t); return; }

for (const b of document.querySelectorAll('#views button')) b.onclick = () => goView(b.dataset.v);
for (const b of document.querySelectorAll('#walls button')) b.onclick = () => {
  for (const x of document.querySelectorAll('#walls button')) x.setAttribute('aria-pressed', x === b);
  buildArch(+b.dataset.h);
};

const opts = location.hash.slice(1).split(',');
const startView = opts.find(o => views[o]) || 'overview';
if (opts.includes('full')) document.querySelector('#walls button[data-h="300"]').click();

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); labelR.setSize(w, h); camera.aspect = w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
roomMaskAll();
renderer.setAnimationLoop(now => {
  if (anim) {
    const k = Math.min(1, (now - anim.t0) / 700), e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2)/2;
    camera.position.lerpVectors(anim.from.p, anim.to.p, e); controls.target.lerpVectors(anim.from.t, anim.to.t, e);
    if (k === 1) anim = null;
  }
  controls.update();
  const showTags = camera.position.y > 450; for (const t of tags) t.visible = showTags;
  renderer.render(scene, camera); labelR.render(scene, camera);
});
