name: Build and Deploy 3D World

on:
  push:
    branches:
      - main
    paths:
      - '3dSource/**'
      - '.github/workflows/deploy-3d.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 3dSource/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./3dSource
        run: pnpm install --frozen-lockfile

      - name: Build project
        working-directory: ./3dSource
        run: pnpm build

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add 3d/
          git diff --staged --quiet || git commit -m "Auto-deploy: Update 3D world [skip ci]"
          git push
